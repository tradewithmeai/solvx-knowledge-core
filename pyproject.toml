[tool.poetry]
name = "solvx-knowledge-core"
version = "0.1.0"
description = "Local-first personal knowledge base with RAG, hybrid search, and intelligent insights"
authors = ["SolVX Team"]
readme = "README.md"
packages = [{include = "backend"}, {include = "cli"}]

[tool.poetry.dependencies]
python = "^3.11"
numpy = "^1.24.0,<2.0"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
pydantic = "^2.5.3"
pydantic-settings = "^2.1.0"
sqlalchemy = "^2.0.25"
alembic = "^1.13.1"
apscheduler = "^3.10.4"
watchdog = "^4.0.0"
typer = {extras = ["all"], version = "^0.9.0"}

# Parsing
pymupdf = "^1.23.21"
pdfminer-six = "^20231228"
readability-lxml = "^0.8.1"
lxml = "^5.1.0"
python-docx = "^1.1.0"
pandas = "^2.2.0"
markdown = "^3.5.2"
mistune = "^3.0.2"
pygments = "^2.17.2"
pytesseract = "^0.3.10"

# Embeddings & Vector Store
chromadb = "^0.4.22"
sentence-transformers = "^2.3.1"
torch = "^2.2.0"
tiktoken = "^0.6.0"
openai = "^1.10.0"
cohere = "^4.47"
voyageai = "^0.2.1"

# Utils
httpx = "^0.26.0"
python-multipart = "^0.0.6"
python-dotenv = "^1.0.1"
blake3 = "^0.4.1"
networkx = "^3.2.1"
python-telegram-bot = "^20.8"
aiosmtplib = "^3.0.1"
email-validator = "^2.1.0"
cryptography = "^42.0.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.4"
pytest-cov = "^4.1.0"
black = "^24.1.1"
isort = "^5.13.2"
ruff = "^0.2.0"
mypy = "^1.8.0"
pre-commit = "^3.6.0"
httpx = "^0.26.0"

[tool.poetry.scripts]
solvx = "cli.main:app"

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "chromadb.*",
    "sentence_transformers.*",
    "readability.*",
    "fitz.*",
    "pdfminer.*",
    "docx.*",
    "mistune.*",
    "pytesseract.*",
    "watchdog.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=backend --cov=cli --cov-report=term-missing --cov-report=html"
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
